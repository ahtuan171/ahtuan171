name: snake
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ahtuan171
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23FF1F35&color_dots=%230B0D10,%232A2D34,%23A81222,%23D9182B,%23FF1F35
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
